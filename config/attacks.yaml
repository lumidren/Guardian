# GUARDIAN Attack Configuration & Parameters (Section 8.2 & Table 8)

attacks:
  ddos_flooding:
    description: "High-rate outbound UDP or HTTP SYN flood targeting external victim"
    default_intensity: 10.0
    protocols: ["udp", "tcp"]
    target_ports: [80, 443, 53]
    packet_rate_multiplier: 50.0

  cnc_beaconing:
    description: "Periodic outbound command-and-control beaconing to external IP"
    default_intensity: 1.0
    protocols: ["tcp", "tls"]
    beacon_interval_s: 1.5
    jitter_pct: 0.15
    destination_ip: "91.240.118.52"

  network_scanning:
    description: "Internal subnet port and host reconnaissance (SYN with RST responses)"
    default_intensity: 2.0
    protocols: ["tcp"]
    target_subnet: "192.168.1.0/24"
    ports_to_probe: [21, 22, 23, 80, 443, 445, 8080, 5555]

  data_exfiltration:
    description: "Sustained high-volume outbound transfer of captured video/telemetry"
    default_intensity: 5.0
    protocols: ["tcp", "tls"]
    payload_size_bytes: 1460
    destination_ip: "198.51.100.89"

  cryptomining:
    description: "Persistent connection to Stratum mining pool with steady small packets"
    default_intensity: 1.0
    protocols: ["tcp"]
    target_ports: [3333, 4444]
    destination_ip: "144.76.12.18"

  zero_day_hybrid:
    description: "The 7,000 Robot Vacuums incident (chain of off-hours activation, foreign endpoint, protocol shift)"
    default_intensity: 3.0
    off_hours_target: 3.78  # 3:47 AM
    destination_ip: "185.220.101.47"  # Moscow, Russia
    protocol_shift: "http"

evasion_modes:
  - none
  - volume_matched   # Mimicry: caps packet rate to normal baseline
  - low_and_slow     # Spreads events across hours to evade burst thresholds
  - delayed          # Begins activity only after prolonged quiet observation
