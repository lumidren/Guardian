[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian"
version = "1.0.0"
description = "Multi-Layer Identity-Based Zero-Day Defense Framework for IoT"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Mustafa (lumidren)", email = "163734075+lumidren@users.noreply.github.com"}
]
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "numpy>=1.26.0",
    "networkx>=3.2.1",
    "structlog>=24.1.0",
    "psutil>=5.9.8",
    "scapy>=2.5.0",
    "paho-mqtt>=2.0.0",
    "websockets>=12.0",
    "requests>=2.31.0",
    "rich>=13.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.5",
    "hypothesis>=6.98.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "httpx>=0.27.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "pip-tools>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

# Strict type-checking on core security packages per M0 specification
[[tool.mypy.overrides]]
module = [
    "guardian.common.*",
    "guardian.features.*",
    "guardian.detection.*",
    "guardian.response.*"
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
