[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-iot"
version = "1.0.0"
description = "Multi-Layer Identity-Based Zero-Day Defense Framework for IoT"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "lumidren", email = "163734075+lumidren@users.noreply.github.com"}
]
keywords = ["iot", "security", "zero-day", "anomaly-detection", "explainable-ai", "isolation-forest"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/lumidren/Guardian"
Repository = "https://github.com/lumidren/Guardian"
