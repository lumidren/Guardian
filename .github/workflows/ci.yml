name: GUARDIAN CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system packages (nftables, iproute2, ping)
      run: |
        sudo apt-get update
        sudo apt-get install -y nftables iproute2 iputils-ping

    - name: Install dependencies (make setup)
      run: |
        python -m pip install --upgrade pip
        make setup
        pip install playwright
        playwright install --with-deps chromium

    - name: Lint with Ruff (make lint)
      run: |
        make lint

    - name: Type check with Mypy (make type)
      run: |
        make type

    - name: Run Tests (make test & cov)
      env:
        PYTHONPATH: src:.
      run: |
        make test
        pytest --cov=src/guardian --cov-report=xml tests/

    - name: Privileged Linux nftables & Playwright Dashboard E2E Verification
      run: |
        sudo env "PATH=$PATH" PYTHONPATH=src:. pytest tests/integration/test_linux_nftables_and_playwright.py -v -s

    - name: Evaluation Battery Demo (make demo)
      env:
        PYTHONPATH: src:.
      run: |
        make demo

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.11'
      continue-on-error: true
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
